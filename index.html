<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
">

    <div style="
        background: white;
        width: 350px;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
    ">

        <h1 style="
            margin-bottom: 30px;
            color: #333;
        ">
            Welcome Back
        </h1>

        <form>

            <input
                type="email"
                placeholder="Enter your email"
                required
                style="
                    width: 100%;
                    padding: 12px;
                    margin-bottom: 15px;
                    border: 1px solid #ccc;
                    border-radius: 8px;
                    box-sizing: border-box;
                "
            >

            <input
                type="password"
                placeholder="Enter your password"
                required
                style="
                    width: 100%;
                    padding: 12px;
                    margin-bottom: 20px;
                    border: 1px solid #ccc;
                    border-radius: 8px;
                    box-sizing: border-box;
                "
            >

            <button
                type="submit"
                style="
                    width: 100%;
                    padding: 12px;
                    border: none;
                    border-radius: 8px;
                    background-color: #667eea;
                    color: white;
                    font-size: 16px;
                    cursor: pointer;
                "
            >
                Login
            </button>

        </form>

        <p style="
            margin-top: 20px;
            color: #777;
        ">
            Don't have an account?
            <a href="#" style="
                color: #667eea;
                text-decoration: none;
                font-weight: bold;
            ">
                Sign Up
            </a>
        </p>

    </div>

</body>
</html>
